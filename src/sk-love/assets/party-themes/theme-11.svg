<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a083b" />
      <stop offset="40%" stop-color="#4e1b68" />
      <stop offset="80%" stop-color="#80389b" />
      <stop offset="100%" stop-color="#b66acb" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a083b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#12021a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="540" height="960" fill="url(#bg)"/>
  <rect width="540" height="960" fill="url(#glow)"/>
  
  <!-- Vertical Bar Left -->
  <rect x="80" y="0" width="30" height="960" fill="#ffffff" opacity="0.15"/>
  <rect x="110" y="0" width="8" height="960" fill="#ffffff" opacity="0.25"/>

  <!-- Flowers background -->
  <g stroke="#e2a8f8" stroke-width="2" fill="none" opacity="0.4">
    <circle cx="420" cy="180" r="35"/>
    <path d="M420 125 L420 235 M365 180 L475 180 M381 141 L459 219 M381 219 L459 141"/>
    
    <circle cx="480" cy="520" r="25"/>
    <path d="M480 480 L480 560 M440 520 L520 520"/>

    <circle cx="340" cy="880" r="45"/>
    <path d="M340 810 L340 950 M270 880 L410 880"/>
  </g>

  <!-- Floating Hearts -->
  <g filter="url(#shadow)">
    <!-- Small top heart -->
    <path d="M 210,80 A 15,15 0 0,0 180,95 A 15,15 0 0,0 150,80 A 15,15 0 0,0 135,110 Q 135,130 180,160 Q 225,130 225,110 A 15,15 0 0,0 210,80 Z" fill="#d884f3"/>
    
    <!-- Medium heart -->
    <path d="M 160,180 A 25,25 0 0,0 110,205 A 25,25 0 0,0 60,180 A 25,25 0 0,0 35,230 Q 35,260 110,310 Q 185,260 185,230 A 25,25 0 0,0 160,180 Z" fill="#c05be1"/>

    <!-- Large center heart -->
    <path d="M 230,340 A 50,50 0 0,0 130,390 A 50,50 0 0,0 30,340 A 50,50 0 0,0 -20,440 Q -20,500 130,600 Q 280,500 280,440 A 50,50 0 0,0 230,340 Z" fill="#9f3ac7"/>
  </g>

  <!-- Calligraphy Text "Love" -->
  <text x="320" y="740" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" opacity="0.95">Love</text>
  
  <!-- Sparkles -->
  <g fill="#ffffff">
    <circle cx="280" cy="220" r="3" opacity="0.8"/>
    <circle cx="390" cy="310" r="4" opacity="0.9"/>
    <circle cx="100" cy="650" r="3" opacity="0.7"/>
    <circle cx="450" cy="790" r="5" opacity="0.85"/>
  </g>
</svg>
