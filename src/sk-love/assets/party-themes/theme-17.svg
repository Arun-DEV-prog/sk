<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#141838" />
      <stop offset="70%" stop-color="#281a38" />
      <stop offset="100%" stop-color="#3b1c32" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="960" fill="url(#night)"/>

  <!-- Twinkling Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="120" r="2"/><circle cx="180" cy="80" r="1.5"/><circle cx="280" cy="150" r="2.5"/>
    <circle cx="380" cy="90" r="1.5"/><circle cx="480" cy="130" r="2"/><circle cx="120" cy="280" r="2"/>
    <circle cx="420" cy="250" r="1.5"/><circle cx="230" cy="320" r="2.5"/><circle cx="490" cy="380" r="2"/>
  </g>

  <!-- Glowing Neon Hearts in Sky -->
  <g stroke="#ff66cc" stroke-width="4" fill="none" filter="url(#neonGlow)">
    <!-- Heart 1 -->
    <path d="M 120,180 A 20,20 0 0,0 80,200 A 20,20 0 0,0 40,180 Q 20,220 80,260 Q 140,220 120,180 Z"/>
    <!-- Heart 2 -->
    <path d="M 480,160 A 25,25 0 0,0 430,185 A 25,25 0 0,0 380,160 Q 355,210 430,260 Q 505,210 480,160 Z"/>
  </g>

  <!-- SK Neon Circles with Letters S K -->
  <g filter="url(#neonGlow)" transform="translate(160, 200)">
    <circle cx="0" cy="0" r="35" stroke="#33ff99" stroke-width="5" fill="#000000" fill-opacity="0.5"/>
    <text x="0" y="12" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  </g>
  <g filter="url(#neonGlow)" transform="translate(380, 200)">
    <circle cx="0" cy="0" r="35" stroke="#33ff99" stroke-width="5" fill="#000000" fill-opacity="0.5"/>
    <text x="0" y="12" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>
  </g>

  <!-- Glowing Hill -->
  <path d="M -50,960 Q 270,680 590,960 Z" fill="#0a0514"/>

  <!-- Glowing Couple Silhouette Holding Hands -->
  <g fill="#000000" stroke="#ffaa66" stroke-width="3" filter="url(#neonGlow)">
    <!-- Boy -->
    <circle cx="210" cy="540" r="20"/>
    <path d="M 210,560 L 190,660 L 170,780 M 210,560 L 225,660 L 240,780 M 210,590 L 170,640 M 210,590 L 260,630"/>

    <!-- Girl -->
    <circle cx="310" cy="560" r="18"/>
    <path d="M 310,580 Q 280,680 260,780 M 310,580 Q 340,680 360,780 M 310,600 L 260,630 M 310,600 L 350,640"/>
  </g>
</svg>
