<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8a39" />
      <stop offset="50%" stop-color="#1b6323" />
      <stop offset="100%" stop-color="#0e3d13" />
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="40%" stop-color="#cc0000" />
      <stop offset="85%" stop-color="#800000" />
      <stop offset="100%" stop-color="#4a0000" />
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2bf8a" />
      <stop offset="50%" stop-color="#c59b5f" />
      <stop offset="100%" stop-color="#997036" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Grass Turf Field -->
  <rect width="540" height="960" fill="url(#grass)"/>

  <!-- Grass Lines texture -->
  <g fill="none" stroke="#3db34c" stroke-width="2" opacity="0.25">
    <path d="M0,100 L540,100 M0,200 L540,200 M0,300 L540,300 M0,400 L540,400 M0,500 L540,500 M0,600 L540,600 M0,700 L540,700 M0,800 L540,800" />
  </g>

  <!-- Wooden Bails lying on grass -->
  <g filter="url(#shadow)">
    <!-- Left Bail -->
    <g transform="translate(110, 560) rotate(-25)">
      <rect x="0" y="0" width="140" height="26" rx="10" fill="url(#wood)"/>
      <rect x="15" y="-6" width="22" height="38" rx="4" fill="url(#wood)"/>
      <rect x="103" y="-6" width="22" height="38" rx="4" fill="url(#wood)"/>
    </g>

    <!-- Right Bail -->
    <g transform="translate(280, 580) rotate(18)">
      <rect x="0" y="0" width="140" height="26" rx="10" fill="url(#wood)"/>
      <rect x="15" y="-6" width="22" height="38" rx="4" fill="url(#wood)"/>
      <rect x="103" y="-6" width="22" height="38" rx="4" fill="url(#wood)"/>
    </g>
  </g>

  <!-- Red Leather Cricket Ball -->
  <g filter="url(#shadow)" transform="translate(270, 420)">
    <circle cx="0" cy="0" r="105" fill="url(#ballGrad)"/>
    
    <!-- White Seam Lines -->
    <path d="M -102,0 A 105,60 0 0,0 102,0" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="6,4"/>
    <path d="M -102,0 A 105,60 0 0,1 102,0" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="6,4"/>
  </g>

  <!-- Title Text -->
  <text x="270" y="820" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CRICKET MATCH</text>
</svg>
