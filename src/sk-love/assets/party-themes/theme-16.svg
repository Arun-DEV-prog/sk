<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6" />
      <stop offset="50%" stop-color="#eae0d0" />
      <stop offset="100%" stop-color="#dfd3c3" />
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5230" />
      <stop offset="50%" stop-color="#54371e" />
      <stop offset="100%" stop-color="#332010" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#54371e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="540" height="960" fill="url(#bg)"/>

  <!-- Ornate White Arch Frame -->
  <rect x="30" y="40" width="480" height="880" rx="30" fill="url(#frame)" stroke="#e0d0c0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="45" y="55" width="450" height="850" rx="20" fill="none" stroke="#7a5230" stroke-width="2" opacity="0.4"/>

  <!-- Hanging Vines Left & Right -->
  <g fill="none" stroke="#604020" stroke-width="2">
    <path d="M 50,60 C 80,180 30,300 70,450 C 100,580 40,700 80,850" />
    <path d="M 490,60 C 460,180 510,300 470,450 C 440,580 500,700 460,850" />
  </g>
  <g fill="#7a5230" opacity="0.7">
    <circle cx="65" cy="120" r="8"/>
    <circle cx="45" cy="220" r="10"/>
    <circle cx="75" cy="350" r="9"/>
    <circle cx="475" cy="140" r="8"/>
    <circle cx="495" cy="260" r="10"/>
    <circle cx="465" cy="380" r="9"/>
  </g>

  <!-- Hanging Brass Lanterns -->
  <!-- Left Lantern -->
  <g transform="translate(140, 60)" filter="url(#shadow)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="url(#bronze)" stroke-width="2"/>
    <rect x="-20" y="120" width="40" height="50" rx="5" fill="#ffe0b2" stroke="url(#bronze)" stroke-width="3"/>
    <polygon points="-20,120 20,120 0,100" fill="url(#bronze)"/>
    <polygon points="-20,170 20,170 0,190" fill="url(#bronze)"/>
  </g>

  <!-- Right Lanterns Stack -->
  <g transform="translate(400, 60)" filter="url(#shadow)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#bronze)" stroke-width="2"/>
    <rect x="-18" y="180" width="36" height="45" rx="5" fill="#ffe0b2" stroke="url(#bronze)" stroke-width="3"/>
    <polygon points="-18,180 18,180 0,165" fill="url(#bronze)"/>
    <polygon points="-18,225 18,225 0,240" fill="url(#bronze)"/>

    <line x1="0" y1="240" x2="0" y2="300" stroke="url(#bronze)" stroke-width="2"/>
    <rect x="-15" y="300" width="30" height="38" rx="4" fill="#ffe0b2" stroke="url(#bronze)" stroke-width="3"/>
  </g>

  <!-- Top Center Crescent & Star -->
  <path d="M 270,110 A 35,35 0 1,0 290,165 A 28,28 0 1,1 270,110 Z" fill="url(#bronze)"/>
  
  <!-- Text -->
  <text x="270" y="760" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#54371e" text-anchor="middle">RAMADAN KAREEM</text>
</svg>
